{% extends "base.html" %}

{% block title %}
    Bejelentkezés - Heni Inventory
{% endblock %}

{% block content %}

<div class="content-narrow">

    <h1>Bejelentkezés</h1>

    <form
        method="post"
        class="form-card"
    >

        <label>
            Felhasználónév

            <input
                type="text"
                name="username"
                autocomplete="username"
                autofocus
                required
            >
        </label>

        <label>
            Jelszó

            <input
                type="password"
                name="password"
                autocomplete="current-password"
                required
            >
        </label>

        <div class="form-actions">
            <button
                class="button primary"
                type="submit"
            >
                Bejelentkezés
            </button>
        </div>

    </form>

</div>

{% endblock %}
