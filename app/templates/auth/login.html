{% extends "base.html" %}

{% block title %}
    {{ _("Bejelentkezés") }} - Heni Inventory
{% endblock %}

{% block content %}

<div class="content-narrow">

    <div class="login-heading">

        <h1>
            {{ _("Bejelentkezés") }}
        </h1>

        <div
            class="language-switcher"
            aria-label="Language"
        >

            <a
                class="
                    language-button
                    {% if selected_language == 'hu' %}
                        active
                    {% endif %}
                "
                href="{{
                    url_for(
                        'auth.login',
                        lang='hu',
                        next=request.args.get('next')
                    )
                }}"
                title="{{ _('Magyar') }}"
                aria-label="{{ _('Magyar') }}"
            >
                🇭🇺
            </a>

            <a
                class="
                    language-button
                    {% if selected_language == 'en' %}
                        active
                    {% endif %}
                "
                href="{{
                    url_for(
                        'auth.login',
                        lang='en',
                        next=request.args.get('next')
                    )
                }}"
                title="{{ _('English') }}"
                aria-label="{{ _('English') }}"
            >
                🇬🇧
            </a>

        </div>

    </div>

    <form
        method="post"
        class="form-card"
    >

        <input
            type="hidden"
            name="lang"
            value="{{ selected_language }}"
        >

        <label>
            {{ _("Felhasználónév") }}

            <input
                type="text"
                name="username"
                autocomplete="username"
                autofocus
                required
            >
        </label>

        <label>
            {{ _("Jelszó") }}

            <input
                type="password"
                name="password"
                autocomplete="current-password"
                required
            >
        </label>

        <div class="form-actions">

            <button
                class="button primary"
                type="submit"
            >
                {{ _("Bejelentkezés") }}
            </button>

        </div>

    </form>

</div>

{% endblock %}
