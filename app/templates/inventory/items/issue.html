{% extends "base.html" %}

{% block title %}
    {{ _('Kiadás -') }} {{ item.name }}
{% endblock %}

{% block content %}

<div class="content-narrow">

    <h1>{{ _('Kiadás') }}</h1>

    <p>
        <strong>{{ item.name }}</strong>
    </p>

    <p class="muted">
        {{ location.name }}
        {{ _('· jelenlegi készlet:') }}
        {{ stock.quantity }} {{ _('db') }}
    </p>

    <form
        method="post"
        class="form-card"
    >

        <label>
            {{ _('Kiadandó mennyiség') }}

            <input
                type="number"
                name="quantity"
                min="1"
                max="{{ stock.quantity }}"
                required
            >
        </label>

        <label>
            {{ _('Megjegyzés') }}

            <textarea
                name="note"
                rows="3"
            ></textarea>
        </label>

        <div class="form-actions">

            <button
                class="button primary"
                type="submit"
            >
                {{ _('Kiadás') }}
            </button>

<a
    class="button"
    href="{{ back_url }}"
>
    {{ _('Mégse') }}
</a>

        </div>

    </form>

</div>

{% endblock %}
