{% extends "base.html" %}

{% block title %}
    {{ _('Korrekció -') }} {{ item.name }}
{% endblock %}

{% block content %}

<div class="content-narrow">

    <h1>{{ _('Készletkorrekció') }}</h1>

    <p>
        <strong>{{ item.name }}</strong>
    </p>

    <p class="muted">
        {{ location.name }}
    </p>

    <div class="stock-current">
        {{ _('Rendszer szerinti készlet:') }}
        <strong>
            {{ stock.quantity }} {{ _('db') }}
        </strong>
    </div>

    <form
        method="post"
        class="form-card"
    >

        <label>
            {{ _('Tényleges mennyiség') }}

            <input
                type="number"
                name="counted_quantity"
                min="0"
                required
                value="{{ stock.quantity }}"
            >
        </label>

        <label>
            {{ _('Megjegyzés') }}

            <textarea
                name="note"
                rows="3"
            ></textarea>
        </label>

        <div class="form-actions">

            <button
                class="button primary"
                type="submit"
            >
                {{ _('Korrekció mentése') }}
            </button>

<a
    class="button"
    href="{{ back_url }}"
>
    {{ _('Mégse') }}
</a>

        </div>

    </form>

</div>

{% endblock %}
