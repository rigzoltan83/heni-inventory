{% extends "base.html" %}

{% block title %}
    Korrekció - {{ item.name }}
{% endblock %}

{% block content %}

<div class="content-narrow">

    <h1>Készletkorrekció</h1>

    <p>
        <strong>{{ item.name }}</strong>
    </p>

    <p class="muted">
        {{ location.name }}
    </p>

    <div class="stock-current">
        Rendszer szerinti készlet:
        <strong>
            {{ stock.quantity }} db
        </strong>
    </div>

    <form
        method="post"
        class="form-card"
    >

        <label>
            Tényleges mennyiség

            <input
                type="number"
                name="counted_quantity"
                min="0"
                required
                value="{{ stock.quantity }}"
            >
        </label>

        <label>
            Megjegyzés

            <textarea
                name="note"
                rows="3"
            ></textarea>
        </label>

        <div class="form-actions">

            <button
                class="button primary"
                type="submit"
            >
                Korrekció mentése
            </button>

        </div>

    </form>

</div>

{% endblock %}
