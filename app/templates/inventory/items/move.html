{% extends "base.html" %}

{% block title %}
    {{ _('Áthelyezés -') }} {{ item.name }}
{% endblock %}

{% block content %}

<div class="content-narrow">

    <h1>{{ _('Áthelyezés') }}</h1>

    <p>
        <strong>{{ item.name }}</strong>
    </p>

    <p class="muted">
        {{ _('Forrás:') }}
        {{ source.name }}
        {{ _('· jelenlegi készlet:') }}
        {{ stock.quantity }} {{ _('db') }}
    </p>

    <form
        method="post"
        class="form-card"
    >

        <label>
            {{ _('Cél tárhely') }}

            <select
                name="destination_id"
                required
            >
                <option value="">
                    {{ _('— válassz —') }}
                </option>

                {% for location in destinations %}
                    <option
                        value="{{ location.id }}"
                    >
                        {{ location.name }}
                        ({{ location.internal_code }})
                    </option>
                {% endfor %}

            </select>
        </label>

        <label>
            {{ _('Mennyiség') }}

            <input
                type="number"
                name="quantity"
                min="1"
                max="{{ stock.quantity }}"
                required
            >
        </label>

        <label>
            {{ _('Megjegyzés') }}

            <textarea
                name="note"
                rows="3"
            ></textarea>
        </label>

        <div class="form-actions">

            <button
                class="button primary"
                type="submit"
            >
                {{ _('Áthelyezés') }}
            </button>

<a
    class="button"
    href="{{ back_url }}"
>
    {{ _('Mégse') }}
</a>

        </div>

    </form>

</div>

{% endblock %}
