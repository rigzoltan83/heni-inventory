{% extends "base.html" %}

{% block title %}
    Jelszó módosítása - Heni Inventory
{% endblock %}

{% block content %}

<div class="content-narrow">

    <h1>Jelszó módosítása</h1>

    <p class="muted">
        Felhasználó:
        <strong>{{ user.display_name }}</strong>
        ({{ user.username }})
    </p>

    <form
        method="post"
        class="form-card"
    >

        <label>
            Új jelszó

            <input
                type="password"
                name="password"
                minlength="8"
                required
            >
        </label>

        <label>
            Új jelszó még egyszer

            <input
                type="password"
                name="password_again"
                minlength="8"
                required
            >
        </label>

        <div class="form-actions">

            <button
                class="button primary"
                type="submit"
            >
                Jelszó mentése
            </button>

            <a
                class="button"
                href="{{ url_for('admin.users') }}"
            >
                Mégse
            </a>

        </div>

    </form>

</div>

{% endblock %}
