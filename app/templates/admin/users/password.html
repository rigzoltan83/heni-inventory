{% extends "base.html" %}

{% block title %}
    {{ _("Jelszó módosítása - Username's Inventory") }}
{% endblock %}

{% block content %}

<div class="content-narrow">

    <h1>{{ _('Jelszó módosítása') }}</h1>

    <p class="muted">
        {{ _('Felhasználó:') }}
        <strong>{{ user.display_name }}</strong>
        ({{ user.username }})
    </p>

    <form
        method="post"
        class="form-card"
    >

        <label>
            {{ _('Új jelszó') }}

            <input
                type="password"
                name="password"
                minlength="8"
                required
            >
        </label>

        <label>
            {{ _('Új jelszó még egyszer') }}

            <input
                type="password"
                name="password_again"
                minlength="8"
                required
            >
        </label>

        <div class="form-actions">

            <button
                class="button primary"
                type="submit"
            >
                {{ _('Jelszó mentése') }}
            </button>

            <a
                class="button"
                href="{{ url_for('admin.users') }}"
            >
                {{ _('Mégse') }}
            </a>

        </div>

    </form>

</div>

{% endblock %}
