{% extends "base.html" %}

{% block title %}
    {{ _('Tételcímke - Heni Inventory') }}
{% endblock %}

{% block content %}

<div class="content-narrow">

    <h1>{{ _('Tételcímke nyomtatása') }}</h1>

    <p>
        <strong>{{ item.name }}</strong>
    </p>

    <p class="muted">
        {{ _('Saját kód:') }}
        {{ item.internal_code }}
    </p>

    <form
        method="post"
        class="form-card"
    >

        <label>
            {{ _('Címkék száma') }}

            <input
                type="number"
                name="quantity"
                min="1"
                max="200"
                required
                value="{{ quantity }}"
            >
        </label>

        <div class="form-actions">

            <button
                class="button primary"
                type="submit"
            >
                {{ _('Nyomtatási előnézet') }}
            </button>

<a
    class="button"
    href="{{ back_url }}"
>
    {{ _('Mégse') }}
</a>

        </div>

    </form>

</div>

{% endblock %}
